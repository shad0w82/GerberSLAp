# Il sito di GerberSLAp (GitHub Pages, sorgente: cartella docs/ del ramo main).
# Tema: just-the-docs, caricato dal sito di GitHub Pages con jekyll-remote-theme (nessun workflow da mantenere).
title: GerberSLAp
description: Manuale e documentazione di GerberSLAp · User manual and documentation for GerberSLAp
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme

# Ogni pagina con intestazione usa il layout del tema.
defaults:
  - scope:
      path: ""
    values:
      layout: default

url: https://shad0w82.github.io
baseurl: /GerberSLAp

search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "↑"

aux_links:
  GitHub: https://github.com/shad0w82/GerberSLAp
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: "Modifica su GitHub · Edit on GitHub"
gh_edit_repository: https://github.com/shad0w82/GerberSLAp
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

footer_content: 'Copyright &copy; 2026 shad0w82 · <a href="https://github.com/shad0w82/GerberSLAp/blob/main/LICENSE">GNU AGPL-3.0</a>'

# I riquadri di nota: in italiano `nota` e `attenzione`, in inglese `note` e `warning`.
callouts:
  nota:
    title: Nota
    color: blue
  attenzione:
    title: Attenzione
    color: red
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red
